name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # retry@v4 runs on Node 24 (avoids actions/checkout@v4 Node 20 deprecation noise).
      - name: Run tests (structure + lint; retry on validator.nu flakiness)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 40
          command: npm test
        env:
          # Canonical product surface (Vercel / www). Do not use GitHub Pages
          # SITE_ORIGIN here — that rewrites sitemap away from www and fails
          # structure.test.js "sitemap.xml: www host".
          SITE_ORIGIN: https://www.promptanatomy.help
          REQUIRE_STRIPE_LINKS: '1'

      - name: Accessibility check (pa11y)
        run: |
          npx serve . -l 3000 &
          npx wait-on -t 60000 http://127.0.0.1:3000/
          npx pa11y http://127.0.0.1:3000/ --config .pa11yrc.json
          npx pa11y http://127.0.0.1:3000/privacy.html --config .pa11yrc.json
          npx pa11y http://127.0.0.1:3000/en/ --config .pa11yrc.json
          npx pa11y http://127.0.0.1:3000/en/privacy.html --config .pa11yrc.json
          npx pa11y http://127.0.0.1:3000/en/hr-ai-prompts/job-description/ --config .pa11yrc.json
          npx pa11y http://127.0.0.1:3000/en/hr-ai-prompts/interview-scorecard/ --config .pa11yrc.json
          npx pa11y http://127.0.0.1:3000/en/hr-ai-prompts/master-hiring-prompt/ --config .pa11yrc.json
          npx pa11y http://127.0.0.1:3000/success.html --config .pa11yrc.json
          npx pa11y http://127.0.0.1:3000/terms.html --config .pa11yrc.json
        env:
          CI: true
