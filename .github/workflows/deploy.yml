# Post-main IndexNow ping. GitHub Pages deploy is retired (leaked the full repo).
# Production = Vercel only. Manual: GitHub → Settings → Pages → Source: None.

name: IndexNow (post-main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - name: Run tests (retry on validator.nu flakiness)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 40
          command: npm test
        env:
          SITE_ORIGIN: https://www.promptanatomy.help
          REQUIRE_STRIPE_LINKS: '1'

  indexnow:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      # Bing / Yandex / ChatGPT Search backends. Non-blocking.
      - name: IndexNow ping
        continue-on-error: true
        run: npm run seo:indexnow:diff
        env:
          SITE_ORIGIN: https://www.promptanatomy.help
