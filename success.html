<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <link rel="canonical" href="https://promptanatomy.help/success.html">
    <meta name="description" content="Thank you for your Personalas PDF purchase. Your secure download link is being prepared.">
    <title>Thank you — Personalas</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg: #F7F8FA;
            --text: #1A202C;
            --text-light: #4A5568;
            --accent: #2B6CB0;
            --accent-hover: #1F4F8B;
            --card-bg: #FFFFFF;
            --border: #E2E8F0;
            --error: #C53030;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 32px 20px;
            min-height: 100vh;
        }
        .container { max-width: 36rem; margin: 0 auto; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
        }
        h1 { font-size: 1.75rem; margin: 0 0 12px; letter-spacing: -0.02em; }
        p { margin: 0 0 14px; color: var(--text-light); }
        .status { font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .btn {
            display: inline-block;
            padding: 12px 22px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 8px;
        }
        .btn:focus-visible { outline: 3px solid var(--accent-hover); outline-offset: 2px; }
        .btn[disabled] { opacity: 0.6; cursor: not-allowed; }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .meta { font-size: 0.9rem; color: var(--text-light); margin-top: 18px; }
        .error { color: var(--error); }
        a { color: var(--accent); font-weight: 600; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="container">
        <article class="card" aria-labelledby="success-title">
            <h1 id="success-title">Thank you for your purchase</h1>
            <p id="status" class="status" role="status" aria-live="polite">
                <span class="spinner" aria-hidden="true"></span>Preparing your secure download link…
            </p>
            <p id="email-line" hidden></p>
            <p>
                <a id="download" class="btn" href="#" hidden>Download PDF</a>
            </p>
            <p id="error" class="error" hidden></p>
            <p class="meta">
                We also sent a long-lived download link to your billing email. Check your inbox and spam folder.
                Need help? Email <a href="mailto:info@promptanatomy.help">info@promptanatomy.help</a>.
            </p>
            <p class="meta"><a href="/en/">Back to Personalas</a> · <a href="/terms.html#refunds">Refunds</a> · <a href="/en/privacy.html">Privacy</a> · <a href="/terms.html#paid-pdf-license">License terms</a></p>
        </article>
    </main>
    <script>
    (function () {
        var statusEl = document.getElementById('status');
        var emailEl = document.getElementById('email-line');
        var downloadEl = document.getElementById('download');
        var errorEl = document.getElementById('error');
        var params = new URLSearchParams(window.location.search);
        var sessionId = params.get('session_id') || '';
        var attempts = 0;
        var maxAttempts = 30;
        var intervalMs = 2000;

        function show(el, text) {
            if (text != null) el.textContent = text;
            el.hidden = false;
        }
        function hide(el) { el.hidden = true; }

        function showError(msg) {
            statusEl.innerHTML = '';
            statusEl.textContent = 'We hit a snag preparing your download.';
            show(errorEl, msg);
        }

        if (!sessionId) {
            showError('Missing checkout session id. If you just paid, please check the email for your download link.');
            return;
        }

        async function poll() {
            attempts += 1;
            try {
                var res = await fetch('/api/download-link?session_id=' + encodeURIComponent(sessionId), {
                    headers: { 'Accept': 'application/json' }
                });
                if (res.status === 202) {
                    if (attempts >= maxAttempts) {
                        showError('Your purchase is still processing. Your download link will arrive by email shortly.');
                        return;
                    }
                    setTimeout(poll, intervalMs);
                    return;
                }
                if (!res.ok) {
                    var body = await res.json().catch(function () { return {}; });
                    showError(body.error || 'We could not find that checkout session. Please check your email for the download link.');
                    return;
                }
                var data = await res.json();
                if (data.status === 'ready' && data.downloadUrl) {
                    statusEl.innerHTML = '';
                    statusEl.textContent = 'Your ' + (data.productName || 'PDF') + ' is ready.';
                    if (data.maskedEmail) {
                        emailEl.textContent = 'A copy of this link was emailed to ' + data.maskedEmail + '.';
                        show(emailEl);
                    }
                    downloadEl.setAttribute('href', data.downloadUrl);
                    show(downloadEl);
                    return;
                }
                showError('Unexpected response from the server. Please check your email for the download link.');
            } catch (_err) {
                if (attempts >= maxAttempts) {
                    showError('Network error. Your download link will arrive by email.');
                    return;
                }
                setTimeout(poll, intervalMs);
            }
        }
        poll();
    })();
    </script>
</body>
</html>
